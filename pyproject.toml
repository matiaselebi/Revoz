[project]
name = "revoz"
version = "0.3.0"
license = "MIT"
description = "Herramienta open source para traducir las voces de videojuegos con la IA que elija cada usuario."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "keyring>=24", "faster-whisper>=1.1", "av>=12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
revoz = "revoz.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revoz = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
